aid: jewelbots
name: Jewelbots
description: >-
  Jewelbots makes smart, codable friendship bracelets designed to teach kids
  (primarily tween girls) to code. The wearable is an Arduino-compatible,
  Bluetooth Low Energy device built on a Nordic nRF chipset that friends can
  program with an Arduino IDE library and firmware, with a companion iOS/Android
  app for pairing and messaging. The project is largely open source: the
  Jewelbots GitHub organization publishes the Arduino library, firmware,
  companion app, and hardware/toolchain repositories. Jewelbots was a 500 Global
  (500 Startups) portfolio company; jewelbots.com now runs as a Shopify
  storefront. It is a hardware/firmware and education company rather than a web
  API provider, and exposes no first-party public HTTP/OpenAPI API.
